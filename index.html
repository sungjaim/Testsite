<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LS | Figure Skating Dress Rental</title>
  <meta name="description" content="피겨 스케이팅 드레스 대여 LS">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="hero-text fade">
        <p class="eyebrow" data-i18n="hero.eyebrow">Figure Skating Dress Rental</p>
        <h1 data-i18n="hero.title">링 위에서 가장 빛나는 순간을 위한 드레스</h1>
        <p class="lead" data-i18n="hero.lead">엘에스는 피겨 스케이팅 드레스를 대여합니다.</p>
        <a class="btn btn-primary" href="dresses.html" data-i18n="hero.cta">드레스 보러가기</a>
      </div>
      <!-- 대표 사진: images/hero.jpg (세로 4:5). 파일이 없으면 연회색 자리표시가 보입니다. -->
      <div class="hero-photo ph fade">
        <img src="images/hero.jpg" alt="" onerror="this.remove()">
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
