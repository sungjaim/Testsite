<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LS | Figure Skating Dress Rental</title>
  <meta name="description" content="피겨 스케이팅 드레스 대여 LS">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="hero-text fade">
        <p class="eyebrow">Figure Skating Dress Rental</p>
        <h1>Made to shine<br>on the ice.</h1>
        <p class="lead" data-i18n="hero.lead">대회와 공연을 위한 피겨 드레스를 대여합니다.</p>
        <a class="btn btn-primary" href="dresses.html" data-i18n="hero.cta">드레스 보러가기</a>
      </div>
      <!-- 슬라이드쇼: data/dresses.js 에서 featured: true 인 드레스가 자동으로 나옵니다. -->
      <figure class="slides fade" id="slides">
        <div class="mat"><div class="slides-frame ph"></div></div>
        <figcaption class="slide-caption">
          <span class="slide-no"></span>
          <span class="slide-name"></span>
        </figcaption>
        <div class="slide-dots"></div>
      </figure>
    </section>

    <!-- 서비스 장점: 문구는 js/i18n.js 의 why.* 에서 고칩니다. -->
    <section class="why" aria-labelledby="why-title">
      <h2 id="why-title" class="eyebrow fade">Why LS</h2>
      <ul class="why-list">
        <li class="fade">
          <p class="why-label">Collection</p>
          <h3 data-i18n="why.1.title">100벌 이상의 드레스</h3>
          <p data-i18n="why.1.body">대회와 공연에 맞는 드레스를 100벌 넘게 갖추고 있습니다.</p>
        </li>
        <li class="fade">
          <p class="why-label">Care</p>
          <h3 data-i18n="why.2.title">깨끗한 정비</h3>
          <p data-i18n="why.2.body">대여가 끝날 때마다 세탁과 점검을 거쳐 깨끗한 상태로 보내 드립니다.</p>
        </li>
        <li class="fade">
          <p class="why-label">Contact</p>
          <h3 data-i18n="why.3.title">간편한 문의</h3>
          <p data-i18n="why.3.body">인스타그램 DM이나 전화·문자로 편하게 물어보세요.</p>
        </li>
      </ul>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="data/dresses.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
