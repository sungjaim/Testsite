<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LS | Figure Skating Dress Rental</title>
  <meta name="description" content="피겨 스케이팅 드레스 대여 LS">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="hero-text fade">
        <p class="eyebrow">Figure Skating Dress Rental</p>
        <h1>Made to shine<br>on the ice.</h1>
        <p class="lead" data-i18n="hero.lead">대회와 공연을 위한 피겨 드레스를 대여합니다.</p>
        <a class="btn btn-primary" href="dresses.html" data-i18n="hero.cta">드레스 보러가기</a>
      </div>
      <!-- 슬라이드쇼: data/dresses.js 에서 featured: true 인 드레스가 자동으로 나옵니다. -->
      <figure class="slides fade" id="slides">
        <div class="slides-frame ph"></div>
        <figcaption class="slide-caption">
          <span class="slide-no"></span>
          <span class="slide-name"></span>
        </figcaption>
        <div class="slide-dots"></div>
      </figure>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="data/dresses.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
