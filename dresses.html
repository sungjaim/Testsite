<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dresses | LS</title>
  <link rel="icon" href="images/logo.png">
  <meta name="description" content="LS 피겨 스케이팅 드레스 대여. 대여 가능한 드레스 목록.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261111c">
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <header class="page-head">
      <h1 class="page-title">Dresses</h1>
      <p class="page-sub" data-i18n="list.sub">마음에 드는 드레스를 골라 문의해 주세요.</p>
    </header>

    <!-- 공연 날짜로 찾기: 날짜를 고르면 그 날짜 공연에 예약 가능한 드레스만 보여요 -->
    <section class="datebar" aria-labelledby="date-label">
      <label class="datebar-label" id="date-label" for="date" data-i18n="date.label">공연 날짜로 찾기</label>
      <div class="date-row">
        <input type="date" id="date" class="date-input">
        <button type="button" class="btn btn-ghost btn-sm" id="date-clear" data-i18n="date.clear" hidden>날짜 지우기</button>
      </div>
      <div class="ev-pick" id="ev-pick" hidden>
        <span class="ev-pick-label" data-i18n="date.events">다가오는 대회</span>
        <div class="chips" id="ev-chips"></div>
      </div>
      <p class="date-result" id="date-result" aria-live="polite"></p>
    </section>

    <!-- 필터: 폰에서는 접혀 있고 "필터"를 누르면 펼쳐져요. 컴퓨터에서는 펼쳐진 채로 나와요. -->
    <details class="filters" id="filters">
      <summary>
        <span class="count" id="count"></span>
        <span class="filters-toggle"><span id="active" class="filters-active"></span><span data-i18n="filter.title">필터</span></span>
      </summary>
      <div class="filters-body">
      <div class="filter-row">
        <span class="filter-label" data-i18n="filter.size">사이즈</span>
        <div class="chips" id="f-size"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label" data-i18n="filter.color">색상</span>
        <div class="chips" id="f-color"></div>
      </div>
      </div>
    </details>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty" hidden>
      <p data-i18n="list.empty">조건에 맞는 드레스가 없어요.</p>
      <button class="btn btn-ghost" type="button" id="reset" data-i18n="list.reset">필터 초기화</button>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js?v=20261111c"></script>
  <script src="data/dresses.js?v=20261111c"></script>
  <script src="js/sheet.js?v=20261111c"></script>
  <script src="js/i18n.js?v=20261111c"></script>
  <script src="js/main.js?v=20261111c"></script>
  <script src="js/catalog.js?v=20261111c"></script>
</body>
</html>
