<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>관리자 | LS</title>
  <!-- 관리자 화면은 검색에 나오지 않게 해요 -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261116a">
</head>
<body>
  <div id="site-header"></div>

  <main class="page admin">
    <header class="page-head">
      <h1 class="page-title">Admin</h1>
      <p class="page-sub" id="adm-sub">예약 관리</p>
    </header>

    <!-- 아직 설정하지 않았을 때 -->
    <section class="adm-box" id="adm-setup" hidden>
      <p>관리자 로그인이 아직 설정되지 않았습니다. 저장소의 <strong>admin/README.md</strong> 순서대로 설정해 주세요.</p>
    </section>

    <!-- 로그인 -->
    <form class="adm-box adm-form" id="adm-login" hidden novalidate>
      <label for="adm-email">이메일</label>
      <input id="adm-email" type="email" autocomplete="username" required>
      <label for="adm-pw">비밀번호</label>
      <input id="adm-pw" type="password" autocomplete="current-password" required>
      <p class="adm-msg" id="adm-login-msg" role="alert"></p>
      <button class="btn btn-primary" type="submit">로그인</button>
    </form>

    <!-- 로그인한 뒤 -->
    <div id="adm-app" hidden>
      <div class="adm-bar">
        <span id="adm-who"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="adm-logout">로그아웃</button>
      </div>

      <section class="adm-box">
        <h2 class="adm-h">예약 추가</h2>
        <form class="adm-form adm-grid" id="adm-add" novalidate>
          <div><label for="adm-dress">의상</label><select id="adm-dress" required></select></div>
          <div><label for="adm-date">공연 날짜</label><input id="adm-date" type="date" required></div>
          <div><label for="adm-name">손님 이름</label><input id="adm-name" type="text" autocomplete="off"></div>
          <div><label for="adm-phone">연락처</label><input id="adm-phone" type="tel" inputmode="tel" autocomplete="off"></div>
          <div class="wide"><label for="adm-memo">메모</label><input id="adm-memo" type="text" autocomplete="off" placeholder="입금 확인, 픽업, 스타킹 등"></div>
          <p class="adm-msg wide" id="adm-add-msg" role="alert"></p>
          <div class="wide"><button class="btn btn-primary" type="submit" id="adm-add-btn">예약 추가</button></div>
        </form>
        <p class="adm-note" id="adm-rule"></p>
      </section>

      <section class="adm-box">
        <h2 class="adm-h">다가오는 예약 <span class="adm-count" id="adm-n"></span></h2>
        <p class="adm-msg" id="adm-list-msg" role="alert"></p>
        <ul class="adm-list" id="adm-list"></ul>
        <details class="adm-past" id="adm-past-wrap" hidden>
          <summary>지난 예약 <span class="adm-count" id="adm-past-n"></span></summary>
          <ul class="adm-list" id="adm-past"></ul>
        </details>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js?v=20261116a"></script>
  <script src="data/dresses.js?v=20261116a"></script>
  <script src="js/sheet.js?v=20261116a"></script>
  <script src="js/i18n.js?v=20261116a"></script>
  <script src="js/main.js?v=20261116a"></script>
  <script src="js/admin.js?v=20261116a"></script>
</body>
</html>
